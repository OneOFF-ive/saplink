name: Sync COS downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to sync; leave empty for latest
        required: false
        type: string
      repair_metadata:
        description: Repair existing installer metadata for older clients without uploading installers
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
    secrets:
      COS_SECRET_ID:
        required: true
      COS_SECRET_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: saplink-cos-download-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'OneOFF-ive/saplink' && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out trusted synchronization scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Check COS credentials are configured
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
        run: |
          if [ -z "$COS_SECRET_ID" ] || [ -z "$COS_SECRET_KEY" ]; then
            echo 'Configure COS_SECRET_ID and COS_SECRET_KEY in repository Actions secrets.' >&2
            exit 1
          fi

      - name: Download and verify both official installers
        if: inputs.repair_metadata != true
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: python3 .github/scripts/prepare-cos-release.py

      - name: Install Tencent COS SDK
        if: inputs.repair_metadata == true || steps.prepare.outputs.ready == 'true'
        run: python3 -m pip install --disable-pip-version-check cos-python-sdk-v5==1.9.44

      - name: Check publishing invariants and SDK compatibility without cloud access
        if: inputs.repair_metadata == true || steps.prepare.outputs.ready == 'true'
        run: |
          python3 .github/scripts/test-sync-cos-release.py -v
          python3 .github/scripts/test-skill-archive.py -v
          python3 .github/scripts/test-prepare-cos-release.py -v

      - name: Upload and verify installers and skill ZIP, then publish latest.json
        if: steps.prepare.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          RELEASE_MANIFEST: ${{ steps.prepare.outputs.manifest }}
        run: python3 .github/scripts/sync-cos-release.py

      - name: Repair existing COS metadata for legacy clients
        if: inputs.repair_metadata == true
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          REPAIR_METADATA_ONLY: '1'
        run: python3 .github/scripts/sync-cos-release.py
