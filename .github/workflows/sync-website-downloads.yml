name: Sync website skill

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag to sync; leave empty for latest
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
    secrets:
      SAPLINK_WEBSITE_SYNC_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: saplink-website-download-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'OneOFF-ive/saplink' && (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out trusted synchronization script
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Select the latest stable skill release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          SKILL_ONLY: '1'
        run: python3 .github/scripts/prepare-website-release.py

      - name: Check skill publication invariants without network access
        run: |
          python3 .github/scripts/test-website-skill.py -v
          python3 .github/scripts/test-prepare-skill.py -v

      - name: Upload skill to the restricted website receiver
        if: steps.prepare.outputs.ready == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SAPLINK_WEBSITE_SYNC_KEY }}
          RELEASE_VERSION: ${{ steps.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          umask 077
          key="$RUNNER_TEMP/saplink-sync-key"
          hosts="$RUNNER_TEMP/saplink-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key"
          unset SSH_PRIVATE_KEY
          printf '%s\n' '118.89.185.57 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINE72nJcd/l97GmHpxJ1UXLwLjR6J4ZMl/3+0IO/RiCl' > "$hosts"
          export SYNC_SSH_KEY="$key" SYNC_SSH_HOSTS="$hosts"
          python3 .github/scripts/sync-website-skill.py

      - name: Verify public skill endpoint
        if: steps.prepare.outputs.ready == 'true'
        env:
          EXPECTED_VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          skills = 'http://118.89.185.57/downloads/skills/latest/'
          with urllib.request.urlopen(skills + 'skill.json', timeout=30) as response:
              skill = json.load(response)
          if skill['version'] != os.environ['EXPECTED_VERSION']:
              raise SystemExit('Public skill version verification failed')
          with urllib.request.urlopen(skills + 'saplink-manager.zip', timeout=30) as response:
              content = response.read(skill['size'] + 1)
          if len(content) != skill['size'] or hashlib.sha256(content).hexdigest() != skill['sha256']:
              raise SystemExit('Public skill ZIP verification failed')
          print('Website skill synchronization verified: v' + skill['version'])
          PY
